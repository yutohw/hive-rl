[project]
name = "hive-rl"
version = "0.1.0"
description = "Self-driving race car trained with PPO inside SideFX Houdini"
readme = "README.md"
authors = [
    { name = "Yuto", email = "188888545+yutohw@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "torch",
]

[project.optional-dependencies]
# Training logs. Install it into Houdini's Python (houdini_pytorch_env), not only here.
wandb = ["wandb>=0.31"]

[project.urls]
Talk = "https://www.youtube.com/watch?v=A0ulPi4lGK8"
Repository = "https://github.com/yutohw/hive-rl"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# Dev .venv only: take torch's CPU build on Linux/WSL instead of the
# multi-GB CUDA build. Houdini gets torch from houdini_pytorch_env, not from here.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]